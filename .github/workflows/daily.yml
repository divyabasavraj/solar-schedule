# Daily live forecast for Pavagada (scripts/daily.py).
# GitHub delays scheduled runs on this repo by 4.5-5.5 h (23-27 Oct: crons
# set for 07:17-08:43 IST fired at 12:01-14:28 IST, all after the 09:00 IST
# gate; 22 Oct never fired). So the tries are set in the small hours IST
# (01:17, 02:13, 03:43, 05:13), where even a 5.5 h delay lands before the
# gate. All are after 00:00 IST, so a run's IST date is the issue day.
# Scheduled runs pass --once, so only the first to succeed before the gate
# saves a forecast; later ones exit. If every try misses the gate, the first
# late one still saves (flagged by its issue time). A manual dispatch always
# runs. The issue time actually used is saved with the data.
name: daily-forecast

on:
  schedule:
    - cron: "47 19 * * *"
    - cron: "43 20 * * *"
    - cron: "13 22 * * *"
    - cron: "43 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - run: uv run python scripts/daily.py ${{ github.event_name == 'schedule' && '--once' || '' }}
      - name: Commit forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet && exit 0
          git commit -m "Daily forecast $(TZ=Asia/Kolkata date +%Y-%m-%dT%H%M)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
