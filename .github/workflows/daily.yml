# Daily live forecast for Pavagada (scripts/daily.py).
# Three tries before the 09:00 IST gate (07:17, 08:13, 08:43 IST), off the
# top of the hour, because GitHub delays or drops scheduled runs: the first
# one, 22 Oct, never fired. Scheduled runs pass --once, so only the first to
# succeed saves a forecast; a manual dispatch always runs. The issue time
# actually used is saved with the data.
name: daily-forecast

on:
  schedule:
    - cron: "47 1 * * *"
    - cron: "43 2 * * *"
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - run: uv run python scripts/daily.py ${{ github.event_name == 'schedule' && '--once' || '' }}
      - name: Commit forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet && exit 0
          git commit -m "Daily forecast $(TZ=Asia/Kolkata date +%Y-%m-%dT%H%M)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
