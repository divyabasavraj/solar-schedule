[project]
name = "solarschedule"
version = "0.1.0"
description = "Day-ahead solar scheduling and CERC DSM deviation-loss analysis for a 100 MW Pavagada plant"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kagglehub>=1.0.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solarschedule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
